# =============================================================================
# Definição dos KPIs
# -----------------------------------------------------------------------------
# type:
#   ordinal      escala inteira [min, max]  -> métrica primária: QWK (kappa quadrático)
#   categorical  rótulos fechados           -> métrica primária: macro-F1
#   text         justificativa livre        -> métrica primária: nota do juiz (0-1)
#                                              ou similaridade (chrF) se juiz desligado
# gt_column       coluna do arquivo de entrada com o valor já validado
# prompt          arquivo em prompts/kpis/  (UM prompt por KPI, igual para todos os modelos)
# output_field    chave do JSON de saída que contém o valor do KPI
# ni_margin       margem de não-inferioridade (mesma unidade da métrica primária)
#                 usada para decidir se um modelo mais barato "empata" com o melhor
# =============================================================================

kpis:

  qualidade_resumo:
    display: "Qualidade do resumo"
    type: ordinal
    scale: {min: 1, max: 5}
    gt_column: qualidade_resumo
    prompt: qualidade_resumo.md
    output_field: nota_final
    ni_margin: 0.05
    needs_transcript: true

  csat:
    display: "CSAT (inferido)"
    type: ordinal
    scale: {min: 1, max: 5}
    gt_column: csat
    prompt: csat.md
    output_field: csat
    ni_margin: 0.05

  razao_csat:
    display: "Razão do CSAT"
    type: text
    gt_column: csat_reasoning
    prompt: razao_csat.md
    output_field: razao_csat
    ni_margin: 0.05
    judge_prompt: reasoning_judge.md
    judge_context: "Justificativa do nível de satisfação do cliente"

  solicitacao_resolvida:
    display: "Solicitação resolvida"
    type: categorical
    labels:
      sim: "A demanda principal do cliente foi atendida durante a chamada."
      parcial: "Parte da demanda foi atendida ou houve encaminhamento com prazo definido."
      nao: "A demanda não foi atendida."
    gt_column: solved
    prompt: solicitacao_resolvida.md
    output_field: resolvida
    ni_margin: 0.03

  persuasion:
    display: "Persuasão / retenção"
    type: categorical
    labels:
      sim: "Houve tentativa de persuasão, retenção ou incentivo do cliente a manter o produto/serviço."
      nao: "Não houve tentativa de persuasão ou retenção."
    gt_column: persuasion
    prompt: persuasion.md
    output_field: persuasion
    ni_margin: 0.03

  solver_reasoning:
    display: "Solver reasoning"
    type: text
    gt_column: solved_reasoning
    prompt: solver_reasoning.md
    output_field: solver_reasoning
    ni_margin: 0.05
    judge_prompt: reasoning_judge.md
    judge_context: "Explicação de como (e se) a solicitação foi resolvida"

  razao_ligacao:
    display: "Razão da ligação"
    type: text
    gt_column: call_reason
    prompt: razao_ligacao.md
    output_field: razao_ligacao
    ni_margin: 0.05
    judge_prompt: reasoning_judge.md
    judge_context: "Motivo principal da chamada"

  first_call_resolution:
    display: "First call resolution"
    type: categorical
    labels:
      sim: "Resolvido durante esta ligação, sem reincidência no mesmo assunto."
      nao: "Encaminhado, transferido, não resolvido ou cliente reincidente."
      indeterminado: "O resumo não permite concluir."
    gt_column: dash_advins_fcr
    prompt: first_call_resolution.md
    output_field: fcr
    ni_margin: 0.03

  empatia:
    display: "Empatia"
    type: categorical
    labels:
      sim: "O atendente demonstrou empatia e acolhimento ao cliente."
      nao: "O atendente não demonstrou empatia."
    gt_column: dash_advins_empathy
    prompt: empatia.md
    output_field: empatia
    ni_margin: 0.03

  clareza_informacoes:
    display: "Clareza das informações"
    type: categorical
    labels:
      sim: "O atendente comunicou de forma clara e compreensível."
      nao: "O atendente não comunicou de forma clara."
    gt_column: dash_advins_clarity
    prompt: clareza_informacoes.md
    output_field: clareza
    ni_margin: 0.03

  odc:
    display: "ODC"
    type: categorical
    labels:
      protocolo_aberto: "Há protocolo aberto ou encaminhamento pendente com prazo definido."
      resolvido_no_contato: "A demanda foi resolvida na própria ligação sem acompanhamento pendente."
      retencao_aplicada: "Houve retenção/compensação aceita pelo cliente, sem pendência técnica."
      cancelamento_efetivado: "Cancelamento ou encerramento foi concluído na ligação."
      encaminhado_tecnico: "Foi necessário abrir chamado ou encaminhar para área técnica."
      transferido: "A ligação foi transferida para outra área e não houve solução na ligação."
      sem_solucao: "Não houve solução nem encaminhamento efetivo durante a conversa."
    gt_column: dash_advins_odc
    prompt: odc.md
    output_field: odc
    ni_margin: 0.03
