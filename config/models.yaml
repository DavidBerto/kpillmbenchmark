    # teto de qualidade / candidato a juiz. Mesma restrição de temperature do
    # claude-haiku-5-5 (ver comentário acima) — é usado como REFERENCIA no
    # notebook 03, e com temperature=0.0 o modelo rejeitava 100% das chamadas,
