    model: claude-haiku-4-5
    tier: intermediario
    pricing: {input: 1.00, cached_input: 0.10, output: 5.00}
    pricing_is_estimate: false
    # ESTIMATIVA: preço sem confirmação oficial em contrato ou tabela pública do provedor.
    batch_discount: 0.0
