  # ---------------- Disponíveis no Nexus, SEM preço verificado (NÃO ativos) ------
  # Vistos na lista de /models do gateway em 2026-10-28, mas sem fonte de preço
  # confiável neste repositório ainda. Para ativar um destes: copie o bloco de
  # um modelo acima (ex.: gpt-4o-mini), troque `model:`/`tier:`, preencha
  # `pricing` com a tabela oficial do provedor (ou do Nexus, se houver markup) e
  # adicione o id na lista `models:` do seu config/benchmark.yaml ou demo.yaml.
  #   gpt-5.1, gpt-5-mini, gpt-5.3-codex, gpt-5.6-terra, gpt-5.6-luna,
  #   gpt-6-sol, gpt-6-luna, gpt-oss-120b, gpt-realtime,
  #   deepseek-v4-pro, deepseek-v4-flash, grok-4.3, grok-4.6, kimi-k2.6,
  #   claude-fable-5, claude-sonnet-5, claude-opus-5

